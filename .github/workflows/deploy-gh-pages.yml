name: Build & Deploy to GitHub Pages

# 每次 push 到 main 分支后自动构建并部署
on:
  push:
    branches: [main]
  # 也允许在 GitHub 界面手动触发
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # 生产构建必须提供 VITE_API_BASE_URL（vite.config.ts 会拒绝空值）。
        # 优先读取仓库变量 VITE_API_BASE_URL，未配置时回退到当前线上后端。
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://notifai-api.enthusjast.cc' }}
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: build site to gh-pages'
