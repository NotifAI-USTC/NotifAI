name: notifai_mobile
description: USTC campus notices with local preferences and offline reading.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  sqflite: ^2.4.5
  path: ^1.9.1
  flutter_widget_from_html_core: ^0.17.4
  html: ^0.15.7
  markdown: ^7.3.1
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  file_picker: ^13.3.0
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  app_links: ^7.2.2
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
